<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Детектор движения кулака</title>
  <style>
    body {
      font-family: Arial, sans-serif;

      overflow: hidden;
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #status-panel {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    #media-player-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 999;
    }

    #media-player-overlay iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="media-player-overlay">
      <div id="yt-player"></div>
    </div>
  </div>

  <div id="controls">
    <button id="start-btn">Запустить</button>
  </div>

  <div id="status-panel">
    <div>Статус: <span id="status-text">Не работает</span></div>
    <div>Кулак найден: <span id="fist-text">Нет</span></div>
    <div>Счетчик махов: <span id="shake-count">0</span> / 5</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const videoElement = document.getElementById('webcam');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status-text');
    const fistText = document.getElementById('fist-text');
    const shakeCountText = document.getElementById('shake-count');
    const overlay = document.getElementById('media-player-overlay');

    let camera = null;
    let isFistClosed = false;
    let shakeCount = 0;
    let lastX = null;
    let lastShakeTime = 0;
    let ytPlayer = null;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0
        }
      });
    }

    function triggerReward() {
      overlay.style.display = 'block';
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        ytPlayer.playVideo();
      }
    }

    function checkIsFist(landmarks) {
      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];

      let foldedFingers = 0;

      for (let i = 0; i < fingerTips.length; i++) {
        const tip = landmarks[fingerTips[i]];
        const pip = landmarks[fingerPips[i]];
        const wrist = landmarks[0];

        const distTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
        const distPip = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);

        if (distTip < distPip) {
          foldedFingers++;
        }
      }

      return foldedFingers >= 3;
    }

    function onResults(results) {
      statusText.innerText = "Работает";

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        isFistClosed = checkIsFist(landmarks);

        fistText.innerText = isFistClosed ? "Да" : "Разомкнута ладонь";

        if (isFistClosed) {
          const currentX = landmarks[0].x;
          const now = Date.now();

          if (lastX !== null && (now - lastShakeTime > 300)) {
            const deltaX = Math.abs(currentX - lastX);
            
            if (deltaX > 0.08) { 
              shakeCount++;
              shakeCountText.innerText = shakeCount;
              lastShakeTime = now;

              if (shakeCount >= 5) {
                shakeCount = 0;
                triggerReward();
              }
            }
          }
          lastX = currentX;
        }
      } else {
        fistText.innerText = "Рука не видна";
        lastX = null;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    startBtn.addEventListener('click', () => {
      if (!camera) {
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        camera.start();
      }
    });
  </script>
</body>
</html>
