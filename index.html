<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Детектор движения кулака</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    #container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #28a745;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #status-panel {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>

  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <!-- Добавлены muted, autoplay и loop для гарантированного запуска без блокировок -->
    <video id="webcam" autoplay playsinline muted loop src="video.mp4"></video>
  </div>

  <div id="controls">
    <button id="start-btn">Запустить</button>
  </div>

  <div id="status-panel">
    <div>Статус: <span id="status-text">Не работает</span></div>
    <div>Кулак найден: <span id="fist-text">Нет</span></div>
    <div>Счетчик махов: <span id="shake-count">0</span> / 5</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status-text');
    const fistText = document.getElementById('fist-text');
    const shakeCountText = document.getElementById('shake-count');

    let camera = null;
    let isFistClosed = false;
    let shakeCount = 0;
    let lastX = null;
    let lastShakeTime = 0;

    // Оптимизированная проверка сжатого кулака
    function checkIsFist(landmarks) {
      // Сравниваем кончики пальцев с соответствующими суставами (PIP)
      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];

      let foldedFingers = 0;

      for (let i = 0; i < fingerTips.length; i++) {
        const tip = landmarks[fingerTips[i]];
        const pip = landmarks[fingerPips[i]];
        const wrist = landmarks[0];

        // Измеряем расстояние до запястья, чтобы определять кулак независимо от наклона кисти
        const distTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
        const distPip = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);

        if (distTip < distPip) {
          foldedFingers++;
        }
      }

      // Если хотя бы 3 пальца из 4 согнуты — считаем за кулак
      return foldedFingers >= 3;
    }

    function onResults(results) {
      statusText.innerText = "Работает";

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        isFistClosed = checkIsFist(landmarks);

        fistText.innerText = isFistClosed ? "Да" : "Разомкнута ладонь";

        if (isFistClosed) {
          const currentX = landmarks[0].x; // Отслеживаем движение по точке запястья
          const now = Date.now();

          if (lastX !== null && (now - lastShakeTime > 300)) {
            const deltaX = Math.abs(currentX - lastX);
            
            // Порог чувствительности для тряски/маха
            if (deltaX > 0.08) { 
              shakeCount++;
              shakeCountText.innerText = shakeCount;
              lastShakeTime = now;

              if (shakeCount >= 5) {
                shakeCount = 0; // Сброс при достижении лимита
              }
            }
          }
          lastX = currentX;
        }
      } else {
        fistText.innerText = "Рука не видна";
        lastX = null;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    startBtn.addEventListener('click', () => {
      // Принудительный запуск видео при клике
      videoElement.play();

      if (!camera) {
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        camera.start();
      }
    });
  </script>
</body>
</html>
