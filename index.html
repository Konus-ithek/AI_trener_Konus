<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Hand Motion Detection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
    }
    .container {
      position: relative;
      width: 640px;
      max-width: 90vw;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    video {
      width: 100%;
      height: 360px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #2563eb; }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      background: #0f172a;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .stat-box { display: flex; gap: 6px; }
    .stat-val { font-weight: bold; color: #38bdf8; }
    #media-player-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #yt-player { width: 80%; height: 80%; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    
    <div class="controls">
      <button id="start-btn">Старт</button>
      
      <div class="stats">
        <div class="stat-box">Статус: <span id="status-text" class="stat-val">Ожидание...</span></div>
        <div class="stat-box">Рука: <span id="fist-text" class="stat-val">-</span></div>
        <div class="stat-box">Махи: <span id="shake-count" class="stat-val">0</span></div>
      </div>
    </div>
  </div>

  <div id="media-player-overlay" style="display:none;">
    <div id="yt-player"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    (function() {
      const video = document.getElementById('webcam');
      const startBtn = document.getElementById('start-btn');
      const statusText = document.getElementById('status-text');

      if (!startBtn || !video) return;

      startBtn.addEventListener('click', async () => {
        try {
          statusText.innerText = "Подключение...";
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 360 } 
          });
          video.srcObject = stream;
          await video.play();

          if (typeof window.hands !== 'undefined') {
            const camera = new window.Camera(video, {
              onFrame: async () => {
                await window.hands.send({ image: video });
              },
              width: 640,
              height: 360
            });
            camera.start();
          }

          statusText.innerText = "Работает";
        } catch (err) {
          console.error(err);
          statusText.innerText = "Ошибка доступа";
        }
      });
    })();
  </script>
