<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }

        /* Экран-заставка */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #overlay h1 {
            color: #ffffff;
            font-size: 2.5rem;
            text-align: center;
            user-select: none;
        }

        /* Видеоконтейнер */
        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Надпись при входе -->
    <div id="overlay">
        <h1>Нажми на экран</h1>
    </div>

    <!-- Видео (Rickroll) -->
    <div id="video-container">
        <iframe 
            id="rickroll" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" 
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const iframe = document.getElementById('rickroll');
        const container = document.getElementById('video-container');

        document.body.addEventListener('click', function startExperience() {
            // Удаляем обработчик, чтобы не срабатывал повторно
            document.body.removeEventListener('click', startExperience);

            // Скрываем заставку с текстом
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);

            // Запускаем видео с помощью YouTube API (postMessage)
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');

            // Запрашиваем полноэкранный режим для контейнера
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) { /* Safari */
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) { /* IE11 */
                container.msRequestFullscreen();
            }
        });
    </script>

</body>
</html>
