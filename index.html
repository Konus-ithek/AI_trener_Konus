<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fist Motion Detection</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      text-align: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-wrapper {
      position: relative;
      width: 320px;
      height: 240px;
    }
    #webcam, #output-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 240px;
      border-radius: 8px;
      transform: scaleX(-1);
    }
    #webcam {
      border: 2px solid #333;
    }
    #debug {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.85);
      padding: 10px;
      text-align: left;
      font-size: 14px;
      border: 1px solid #555;
      z-index: 100;
      border-radius: 6px;
    }
    #prank-video {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 999;
      background: #000;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="debug">
    <div>Камера: <span id="cam-status">выключена</span></div>
    <div>Движение кулаков: <span id="motion-val">0</span></div>
    <div>Счетчик: <span id="shake-val">0 / 6</span></div>
  </div>

  <div id="start-screen">
    <h2>Детектор движения кулаков</h2>
    <p>Нажми кнопку и помаши кулаками перед камерой</p>
    <button onclick="startApp()">Запустить</button>
  </div>

  <div class="video-wrapper">
    <video id="webcam" playsinline></video>
    <canvas id="output-canvas" width="320" height="240"></canvas>
  </div>

  <!-- Прямой MP4 файл без рекламы -->
  <video id="prank-video" src="https://upload.wikimedia.org/wikipedia/commons/2/22/Rick_Astley_-_Never_Gonna_Give_You_Up_%281987%29.ogv" playsinline></video>
</div>

<script>
  const webcamElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const prankVideo = document.getElementById('prank-video');
  const motionValEl = document.getElementById('motion-val');
  const shakeValEl = document.getElementById('shake-val');
  const camStatusEl = document.getElementById('cam-status');

  let lastWristY = null;
  let shakeCount = 0;
  let triggered = false;

  async function startApp() {
    document.getElementById('start-screen').style.display = 'none';
    camStatusEl.innerText = "Подключение...";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      webcamElement.srcObject = stream;
      await webcamElement.play();
      camStatusEl.innerText = "Работает";

      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 0,
        smoothLandmarks: true
      });

      pose.onResults(onResults);

      const camera = new Camera(webcamElement, {
        onFrame: async () => {
          if (!triggered) await pose.send({ image: webcamElement });
        },
        width: 320,
        height: 240
      });
      camera.start();
    } catch (err) {
      camStatusEl.innerText = "Ошибка камеры";
      console.error(err);
    }
  }

  function onResults(results) {
    if (triggered) return;

    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (!results.poseLandmarks) {
      motionValEl.innerText = "Руки не видны";
      return;
    }

    // Индексы 15 и 16 — левое и правое запястья (кулаки)
    const leftWrist = results.poseLandmarks[15];
    const rightWrist = results.poseLandmarks[16];

    // Рисуем маркеры только на запястьях/кулаках
    drawWristPoint(leftWrist);
    drawWristPoint(rightWrist);

    if (leftWrist || rightWrist) {
      let currentY = 0;
      if (leftWrist && rightWrist) {
        currentY = (leftWrist.y + rightWrist.y) / 2;
      } else {
        currentY = leftWrist ? leftWrist.y : rightWrist.y;
      }

      if (lastWristY !== null) {
        const deltaY = Math.abs(currentY - lastWristY);
        motionValEl.innerText = deltaY.toFixed(3);

        // Порог срабатывания только для резких махов кистями
        if (deltaY > 0.035) { 
          shakeCount += 1;
          shakeValEl.innerText = `${Math.floor(shakeCount)} / 6`;
        } else {
          if (shakeCount > 0) shakeCount -= 0.05; // Очень плавный спад
        }

        if (shakeCount >= 6) {
          triggered = true;
          doTrigger();
        }
      }
      lastWristY = currentY;
    }
  }

  function drawWristPoint(landmark) {
    if (!landmark || landmark.visibility < 0.5) return;
    const x = landmark.x * canvasElement.width;
    const y = landmark.y * canvasElement.height;

    canvasCtx.beginPath();
    canvasCtx.arc(x, y, 10, 0, 2 * Math.PI);
    canvasCtx.fillStyle = '#00ff00';
    canvasCtx.fill();
    canvasCtx.lineWidth = 2;
    canvasCtx.strokeStyle = '#ffffff';
    canvasCtx.stroke();
  }

  function doTrigger() {
    camStatusEl.innerText = "СРАБОТАЛО!";
    prankVideo.style.display = 'block';
    prankVideo.play();
  }
</script>

</body>
</html>
