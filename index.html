<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Detection Test</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      text-align: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #webcam {
      width: 320px;
      height: 240px;
      border: 2px solid #00ff00;
      border-radius: 8px;
      transform: scaleX(-1); /* Зеркалка */
    }
    #debug {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      text-align: left;
      font-size: 14px;
      border: 1px solid #555;
      z-index: 100;
    }
    #rickroll-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 999;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="debug">
    <div>Камера: <span id="cam-status">выключена</span></div>
    <div>Движение: <span id="motion-val">0</span></div>
    <div>Счетчик: <span id="shake-val">0 / 3</span></div>
  </div>

  <div id="start-screen">
    <h2>Проверка движения</h2>
    <p>Нажми кнопку, разреши камеру и помаши/потряси руками</p>
    <button onclick="startApp()">Запустить камеру</button>
  </div>

  <video id="webcam" playsinline></video>
  <video id="rickroll-player" src="https://archive.org/download/RickAstleyNeverGonnaGiveYouUp/RickAstleyNeverGonnaGiveYouUp.mp4" controls></video>
</div>

<script>
  const webcamElement = document.getElementById('webcam');
  const rickrollPlayer = document.getElementById('rickroll-player');
  const motionValEl = document.getElementById('motion-val');
  const shakeValEl = document.getElementById('shake-val');
  const camStatusEl = document.getElementById('cam-status');

  let lastWristY = null;
  let shakeCount = 0;
  let triggered = false;

  async function startApp() {
    document.getElementById('start-screen').style.display = 'none';
    camStatusEl.innerText = "Подключение...";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      webcamElement.srcObject = stream;
      await webcamElement.play();
      camStatusEl.innerText = "Работает";

      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 0,
        smoothLandmarks: true
      });

      pose.onResults(onResults);

      const camera = new Camera(webcamElement, {
        onFrame: async () => {
          if (!triggered) await pose.send({ image: webcamElement });
        },
        width: 320,
        height: 240
      });
      camera.start();
    } catch (err) {
      camStatusEl.innerText = "Ошибка доступа к камере";
      console.error(err);
    }
  }

  function onResults(results) {
    if (triggered || !results.poseLandmarks) return;

    // Берем левое (15) и правое (16) запястья
    const leftWrist = results.poseLandmarks[15];
    const rightWrist = results.poseLandmarks[16];

    if (leftWrist && rightWrist) {
      const avgY = (leftWrist.y + rightWrist.y) / 2;

      if (lastWristY !== null) {
        const deltaY = Math.abs(avgY - lastWristY);
        motionValEl.innerText = deltaY.toFixed(4);

        // Порог снижен до 0.02 для более легкой сработки
        if (deltaY > 0.02) { 
          shakeCount++;
          shakeValEl.innerText = `${shakeCount} / 3`;
        } else {
          if (shakeCount > 0) shakeCount -= 0.1; // Постепенное затухание
        }

        if (shakeCount >= 3) {
          triggered = true;
          doTrigger();
        }
      }
      lastWristY = avgY;
    } else {
      motionValEl.innerText = "Руки не видны";
    }
  }

  function doTrigger() {
    camStatusEl.innerText = "СРАБОТАЛО!";
    rickrollPlayer.style.display = 'block';
    rickrollPlayer.currentTime = 0;
    rickrollPlayer.play();
  }
</script>

</body>
</html>
