<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fist Motion Detection (No Ads)</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      text-align: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #webcam {
      width: 320px;
      height: 240px;
      border: 2px solid #28a745;
      border-radius: 8px;
      transform: scaleX(-1);
    }
    #debug {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      text-align: left;
      font-size: 14px;
      border: 1px solid #555;
      z-index: 100;
    }
    #rickroll-video {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 999;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="debug">
    <div>Статус: <span id="cam-status">выключена</span></div>
    <div>Кулак найден: <span id="fist-status">Нет</span></div>
    <div>Счетчик махов: <span id="shake-val">0 / 5</span></div>
  </div>

  <div id="start-screen">
    <h2>Детектор движения кулаков</h2>
    <p>Нажмите кнопку и машите сжатым кулаком перед камерой</p>
    <button onclick="startApp()">Запустить</button>
  </div>

  <video id="webcam" playsinline></video>

  <!-- Прямой MP4 файл без рекламы -->
  <video id="rickroll-video" controls>
    <source src="https://shattereddisk.github.io/rickroll/rickroll.mp4" type="video/mp4">
  </video>
</div>

<script>
  const webcamElement = document.getElementById('webcam');
  const rickrollVideo = document.getElementById('rickroll-video');
  const fistStatusEl = document.getElementById('fist-status');
  const shakeValEl = document.getElementById('shake-val');
  const camStatusEl = document.getElementById('cam-status');

  let lastFistX = null;
  let shakeCount = 0;
  let triggered = false;

  // Проверка: сжат ли кулак (кончики пальцев ниже средних фаланг)
  function isFist(landmarks) {
    const fingerTips = [8, 12, 16, 20];
    const fingerPips = [6, 10, 14, 18];

    for (let i = 0; i < fingerTips.length; i++) {
      if (landmarks[fingerTips[i]].y < landmarks[fingerPips[i]].y) {
        return false; // Если хоть один палец разогнут вверх — это не кулак
      }
    }
    return true;
  }

  async function startApp() {
    document.getElementById('start-screen').style.display = 'none';
    camStatusEl.innerText = "Подключение...";

    try {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onResults);

      const camera = new Camera(webcamElement, {
        onFrame: async () => {
          if (!triggered) await hands.send({ image: webcamElement });
        },
        width: 320,
        height: 240
      });

      await camera.start();
      camStatusEl.innerText = "Работает";
    } catch (err) {
      camStatusEl.innerText = "Ошибка доступа";
      console.error(err);
    }
  }

  function onResults(results) {
    if (triggered) return;

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const landmarks = results.multiHandLandmarks[0];

      if (isFist(landmarks)) {
        fistStatusEl.innerText = "Да";
        const currentX = landmarks[0].x; // Положение запястья/кисти

        if (lastFistX !== null) {
          const deltaX = Math.abs(currentX - lastFistX);

          // Фиксируем только явные махи кулаком из стороны в сторону
          if (deltaX > 0.05) {
            shakeCount++;
            shakeValEl.innerText = `${shakeCount} / 5`;
          }

          if (shakeCount >= 5) {
            triggered = true;
            doTrigger();
          }
        }
        lastFistX = currentX;
      } else {
        fistStatusEl.innerText = "Разогнута ладонь";
        lastFistX = null;
      }
    } else {
      fistStatusEl.innerText = "Рука не видна";
      lastFistX = null;
    }
  }

  function doTrigger() {
    camStatusEl.innerText = "СРАБОТАЛО!";
    rickrollVideo.style.display = 'block';
    rickrollVideo.play();
  }
</script>

</body>
</html>
